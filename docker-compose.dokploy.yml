services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    shm_size: ${APP_SHM_SIZE:-256m}
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
        reservations:
          memory: 256m
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
