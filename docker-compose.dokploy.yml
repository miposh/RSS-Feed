services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    shm_size: ${APP_SHM_SIZE:-256m}
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import psutil; exit(0 if psutil.virtual_memory().percent < 85 else 1)' 2>/dev/null || exit 0"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
        reservations:
          memory: 256m
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
