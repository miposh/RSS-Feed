services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    shm_size: ${APP_SHM_SIZE:-256m}
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
        reservations:
          memory: 256m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rss_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rss_bot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-512m}
        reservations:
          memory: 128m

volumes:
  pg_data:
