[default]

[development]

    [development.logs]
        LEVEL_NAME = "DEBUG"
        FORMAT = '[%(asctime)s] #%(levelname)-8s %(filename)s:%(lineno)d - %(name)s - %(message)s'

    [development.bot]
        PARSE_MODE = 'HTML'

    [development.postgres]
        NAME = 'rss_bot'
        HOST = 'localhost'
        PORT = 5432
        USER = 'postgres'
    
    [development.redis]
        HOST = 'localhost'
        PORT = 6379
        DATABASE = 0

[production]

    [production.logs]
        LEVEL_NAME = "INFO"
        FORMAT = '%(asctime)s [%(levelname)s] %(message)s'

    [production.bot]
        PARSE_MODE = 'HTML'

    [production.postgres]
        NAME = 'rss_bot'
        HOST = 'localhost'
        PORT = 5432
        USER = 'postgres'
    
    [production.redis]
        HOST = 'localhost'
        PORT = 6379
        DATABASE = 0
